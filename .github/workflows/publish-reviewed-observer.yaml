name: Publish reviewed observer image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/guischet/bip300301_enforcer
  SOURCE_COMMIT: 2ea92c062869199bfec21dd21fdd6192a87dafec
  SOURCE_TAG: sha-2ea92c062869

jobs:
  publish:
    name: Build linux/amd64 image from the reviewed commit
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the reviewed source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Determine the pinned Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the reviewed image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_TAG }}
          build-args: |
            RUST_VERSION=${{ steps.rust-version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/GuiSchet/bip300301_enforcer
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          provenance: false
          sbom: false
