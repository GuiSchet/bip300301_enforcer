name: Publish verified v7 OCI archives
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-verified-v7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install OCI copy tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo
      - name: Verify and publish the approved bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/v7-registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username guischet --password-stdin ghcr.io
          publish() {
            local archive="$1" destination="$2" expected="$3" actual
            if skopeo inspect --raw "docker://$destination" > existing.json 2>/dev/null; then
              actual="sha256:$(sha256sum existing.json | cut -d ' ' -f1)"
              [[ "$actual" == "$expected" ]] || { echo 'immutable image tag already has a different digest'; exit 1; }
            else
              skopeo copy --preserve-digests "oci-archive:$archive" "docker://$destination"
            fi
            actual="sha256:$(skopeo inspect --raw "docker://$destination@$expected" | sha256sum | cut -d ' ' -f1)"
            [[ "$actual" == "$expected" ]]
            printf 'Verified %s@%s\n' "$destination" "$expected"
          }
          gh release download observer-v7-20261004 --repo GuiSchet/bip300301_enforcer --pattern enforcer.oci.tar --dir artifacts
          printf '%s\n' 'b20ab8899df439962fcfc69b5707e37e3826803fe90d76c5543f2f320509893d  artifacts/enforcer.oci.tar' | sha256sum --check
          publish 'artifacts/enforcer.oci.tar' 'ghcr.io/guischet/bip300301_enforcer:sha-9b2a15621469' 'sha256:c5b2bb10650d8226671e9c1d8fe5cc791a8041cc7b7b85b86e2d90267c63cc5c'
